services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/caddy
      - ./data:/data
      - ./config:/config
