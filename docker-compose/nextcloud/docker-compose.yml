services:
  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:lts
    restart: always
    volumes:
      - /your/desired/folder/docker/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - nextcloud-net

  nextcloud-app:
    container_name: nextcloud-app
    image: nextcloud:latest
    restart: always
    volumes:
      - /your/desired/folder/docker/nextcloud/data:/var/www/html/data # CHANGE "/your/desired/folder/" to your actual directory!
      - /your/desired/folder/docker/nextcloud/config:/var/www/html/config # CHANGE "/your/desired/folder/" to your actual directory!
      - /your/desired/folder/docker/nextcloud/custom_apps:/var/www/html/custom_apps # CHANGE "/your/desired/folder/" to your actual directory!
    ports:
      - 8080:80
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=10G

    networks:
      - nextcloud-net
    depends_on:
      - nextcloud-db

networks:
  nextcloud-net:
    driver: bridge